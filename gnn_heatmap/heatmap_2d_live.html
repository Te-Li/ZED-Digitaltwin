<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masked 2D Heatmap Live</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    body { margin:0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#1a1a2e; color:#eee; }
    header { padding:16px 24px; background:#16213e; border-bottom:1px solid #0f3460; }
    h1 { margin:0 0 6px; font-size:1.25rem; }
    p { margin:0; color:#94a3b8; font-size:0.85rem; }
    .meta { margin-top:8px; display:flex; gap:20px; flex-wrap:wrap; font-size:0.8rem; color:#cbd5e1; }
    .live { color:#4ade80; }
    .err { color:#f87171; }
    #chart { width:100%; height:calc(100vh - 120px); }
  </style>
</head>
<body>
  <header>
    <h1>Masked 2D Heatmap</h1>
    <p id="subtitle">Connecting...</p>
    <div class="meta" id="meta"></div>
  </header>
  <div id="chart"></div>
  <script>
    const API = "/api/live/heatmap2d";
    const REFRESH_MS = 1500;
    let lastMtime = null, chartReady = false;

    function jet(t) {
      t = Math.max(0, Math.min(1, t));
      return [
        Math.round(Math.max(0, Math.min(1, 1.5 - Math.abs(4*t-3))) * 255),
        Math.round(Math.max(0, Math.min(1, 1.5 - Math.abs(4*t-2))) * 255),
        Math.round(Math.max(0, Math.min(1, 1.5 - Math.abs(4*t-1))) * 255),
      ];
    }
    const colorscale = Array.from({length:21}, (_, i) => {
      const t = i/20; const [r,g,b] = jet(t); return [t, `rgb(${r},${g},${b})`];
    });

    function displayTime(value) {
      if (!value) return new Date().toLocaleTimeString();
      const date = typeof value === "number" ? new Date(value * 1000) : new Date(value);
      return date.toLocaleTimeString();
    }

    function basename(path) {
      return (path || "").split(/[/\\]/).pop();
    }

    function render(d) {
      const w = d.width_m ?? 4, h = d.height_m ?? 2.4;
      const nx = d.nx ?? d.values[0].length, ny = d.ny ?? d.values.length;
      const cell = d.cell_x_m ?? 0.4;
      const vmax = (d.intensity_range?.max ?? 1) || 1;
      const x = Array.from({length:nx}, (_, i) => +((i+0.5)*cell).toFixed(3));
      const y = Array.from({length:ny}, (_, i) => +((i+0.5)*cell).toFixed(3));
      const trace = {
        type:"heatmap", z:d.values, x, y, colorscale, zmin:0, zmax:vmax,
        colorbar:{title:"Intensity", titleside:"right"},
        hovertemplate:"X=%{x}m<br>Y=%{y}m<br>Intensity=%{z:.4f}<extra></extra>",
      };
      const layout = {
        paper_bgcolor:"#1a1a2e", plot_bgcolor:"#0f172a", font:{color:"#e2e8f0"},
        margin:{l:60,r:40,t:20,b:60},
        xaxis:{title:`X / width (m) - ${w}m`, scaleanchor:"y", scaleratio:1},
        yaxis:{title:`Y / depth (m) - ${h}m`},
      };
      if (!chartReady) { Plotly.newPlot("chart", [trace], layout, {responsive:true}); chartReady = true; }
      else { Plotly.react("chart", [trace], layout); }

      const svi = d.social_vitality?.index;
      const ts = displayTime(d.source_ground_top_mask_mtime || d.source_3d_mtime || d.generated_at);
      document.getElementById("subtitle").innerHTML =
        `<span class="live">auto refresh</span> ${d.scene_id || ""} / ${w}m x ${h}m / updated ${ts}`;
      document.getElementById("meta").innerHTML = [
        `<span>3D: <b>${basename(d.source_3d)}</b></span>`,
        `<span>mask: <b>${basename(d.source_ground_top_mask)}</b></span>`,
        `<span>grid: <b>${nx}x${ny}</b> / 400mm</span>`,
        d.ground_top_observation_count != null ? `<span>observations: <b>${d.ground_top_observation_count}</b></span>` : "",
        d.ground_top_mask_cell_count != null ? `<span>masked: <b>${d.ground_top_mask_cell_count}</b></span>` : "",
        d.entity_cell_count != null ? `<span>entity blank: <b>${d.entity_cell_count}</b></span>` : "",
        svi != null ? `<span>SVI: <b>${svi.toFixed(3)}</b></span>` : "",
        `<span>intensity: <b>${(d.intensity_range?.min??0).toFixed(3)} ~ ${vmax.toFixed(3)}</b></span>`,
      ].filter(Boolean).join("");
    }

    async function tick() {
      try {
        const resp = await fetch(API + "?t=" + Date.now());
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || resp.statusText);
        }
        const d = await resp.json();
        const mtime = d.source_ground_top_mask_mtime || d.source_3d_mtime || d.generated_at;
        const changed = mtime !== lastMtime;
        if (changed) lastMtime = mtime;
        if (changed || !chartReady) render(d);
      } catch (e) {
        document.getElementById("subtitle").innerHTML =
          `<span class="err">waiting for inputs...</span> ${e.message} / <span class="live">retrying</span>`;
      }
    }
    tick(); setInterval(tick, REFRESH_MS);
  </script>
</body>
</html>
